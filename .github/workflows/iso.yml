name: PBS-X offline ISO
run-name: "PBS-X ISO ${{ inputs.release_tag || inputs.version || 'checks' }} [${{ inputs.request_id || github.run_id }}]"
on:
  pull_request:
    paths:
      - 'packaging/iso/**'
      - 'tools/pbsx_iso.py'
      - 'tools/build-pbsx-iso.py'
      - 'tools/fetch-pbsx-iso-release.py'
      - 'tools/pbsx_iso_publication.py'
      - 'tools/publish-pbsx-server.py'
      - 'tests/iso-publication.test.py'
      - 'tests/pbsx-iso.test.py'
      - 'tools/build-pbsx-repository-package.sh'
      - '.github/workflows/iso.yml'
  push:
    paths:
      - 'packaging/iso/**'
      - 'tools/pbsx_iso.py'
      - 'tools/build-pbsx-iso.py'
      - 'tools/fetch-pbsx-iso-release.py'
      - 'tools/pbsx_iso_publication.py'
      - 'tools/publish-pbsx-server.py'
      - 'tests/iso-publication.test.py'
      - 'tests/pbsx-iso.test.py'
      - 'tools/build-pbsx-repository-package.sh'
      - '.github/workflows/iso.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Exact hash-pinned input release prepared by the stable server publisher'
        required: true
        type: string
      request_id:
        description: 'Publisher correlation ID'
        required: false
        type: string
      version:
        description: 'Expected PBS-X version (empty uses the selected input release)'
        required: false
        type: string
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Offline package and repository regression tests
        run: |
          python3 tests/pbsx-iso.test.py
          python3 tests/iso-publication.test.py
          python3 packaging/pbsx-repository/test_apt_guard.py
  build:
    if: github.event_name == 'workflow_dispatch'
    needs: checks
    runs-on: ubuntu-24.04
    container: debian:13-slim
    defaults:
      run:
        shell: bash
    timeout-minutes: 60
    steps:
      - name: Install image tools with current Debian trust roots
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y xorriso squashfs-tools debian-archive-keyring gnupg curl python3 git gh ca-certificates
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Fetch hash-pinned release packages
        env:
          GH_TOKEN: ${{ github.token }}
          PBSX_VERSION: ${{ inputs.version }}
          PBSX_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          args=()
          if [ -n "$PBSX_VERSION" ]; then args+=(--version "$PBSX_VERSION"); fi
          if [ -n "$PBSX_RELEASE_TAG" ]; then args+=(--release-tag "$PBSX_RELEASE_TAG"); fi
          python3 tools/fetch-pbsx-iso-release.py --output artifacts/iso/inputs "${args[@]}"
      - name: Build from verified upstream media and signed package repositories
        env:
          PBSX_VERSION: ${{ inputs.version }}
        run: |
          # The checkout is owned by the runner UID; this build container is root.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          args=()
          if [ -n "$PBSX_VERSION" ]; then args+=(--version "$PBSX_VERSION"); fi
          python3 tools/build-pbsx-iso.py --packages-dir artifacts/iso/inputs --output artifacts/iso/pbsx-offline-amd64.iso "${args[@]}"
      - name: Verify checksum
        working-directory: artifacts/iso
        run: sha256sum --check pbsx-offline-amd64.iso.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pbsx-offline-iso-amd64
          path: |
            artifacts/iso/pbsx-offline-amd64.iso
            artifacts/iso/pbsx-offline-amd64.iso.sha256
            artifacts/iso/pbsx-offline-amd64.manifest.json
            artifacts/iso/pbsx-offline-amd64.boot.txt
          compression-level: 0
          retention-days: 14
