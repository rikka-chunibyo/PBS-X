name: PBS-X offline ISO
on:
  pull_request:
    paths:
      - 'packaging/iso/**'
      - 'tools/pbsx_iso.py'
      - 'tools/build-pbsx-iso.py'
      - 'tests/pbsx-iso.test.py'
      - 'tools/build-pbsx-repository-package.sh'
      - '.github/workflows/iso.yml'
  push:
    paths:
      - 'packaging/iso/**'
      - 'tools/pbsx_iso.py'
      - 'tools/build-pbsx-iso.py'
      - 'tests/pbsx-iso.test.py'
      - 'tools/build-pbsx-repository-package.sh'
      - '.github/workflows/iso.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Published PBS-X version (empty selects latest matching package set)'
        required: false
        type: string
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Offline package and repository regression tests
        run: |
          python3 tests/pbsx-iso.test.py
          python3 packaging/pbsx-repository/test_apt_guard.py
  build:
    if: github.event_name == 'workflow_dispatch'
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install image tools
        run: sudo apt-get update && sudo apt-get install -y xorriso squashfs-tools debian-archive-keyring gnupg curl
      - name: Check public feed connectivity
        run: |
          if ! curl --fail-with-body --silent --show-error --max-time 30 \
            --dump-header "$RUNNER_TEMP/feed.headers" --output "$RUNNER_TEMP/feed.response" \
            https://pbsx.rikka.ca/apt/dists/trixie/InRelease; then
            python3 - <<'PYCODE'
          import os, pathlib, re
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          for line in (root/'feed.headers').read_text().splitlines():
              if line.lower().startswith(('http/', 'server:', 'cf-mitigated:', 'cf-cache-status:', 'x-served-by:')):
                  print(line)
          title = re.search(r'<title>(.*?)</title>', (root/'feed.response').read_text(), re.I | re.S)
          if title:
              print('Public endpoint response:', title.group(1).strip()[:160])
          PYCODE
            exit 1
          fi
      - name: Build from verified upstream media and signed package repositories
        env:
          PBSX_VERSION: ${{ inputs.version }}
        run: |
          args=()
          if [ -n "$PBSX_VERSION" ]; then args+=(--version "$PBSX_VERSION"); fi
          python3 tools/build-pbsx-iso.py --output artifacts/iso/pbsx-offline-amd64.iso "${args[@]}"
      - name: Verify checksum
        working-directory: artifacts/iso
        run: sha256sum --check pbsx-offline-amd64.iso.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pbsx-offline-iso-amd64
          path: |
            artifacts/iso/pbsx-offline-amd64.iso
            artifacts/iso/pbsx-offline-amd64.iso.sha256
            artifacts/iso/pbsx-offline-amd64.manifest.json
            artifacts/iso/pbsx-offline-amd64.boot.txt
          compression-level: 0
          retention-days: 14
