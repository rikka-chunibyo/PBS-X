name: Android build and checks
on:
  push:
    paths: ['pbsx-android/**', 'pbsx-host-agent/third_party/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['pbsx-android/**', 'pbsx-host-agent/third_party/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GOWORK: 'off'
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
    defaults:
      run:
        working-directory: pbsx-android
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: pbsx-android/core/go.mod
          cache-dependency-path: pbsx-android/core/go.sum
      - name: Select Java and install pinned Android tools
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - name: Build real universal Go bindings
        working-directory: pbsx-android/core
        run: |
          go install golang.org/x/mobile/cmd/gomobile golang.org/x/mobile/cmd/gobind
          mkdir -p ../app/libs
          "$(go env GOPATH)/bin/gomobile" bind -target=android/arm64,android/amd64 -androidapi 26 -javapkg com.pbsx.core -o ../app/libs/mobilecore.aar ./mobilecore
      - name: Compile both app variants, run Java tests and lint
        run: bash ./gradlew --no-daemon --max-workers=2 --console=plain :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:testReleaseUnitTest :app:lintDebug :app:lintRelease
      - name: Exercise SAF restores on a disposable Android 13 emulator
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'emulator' 'system-images;android-33;google_apis;x86_64'
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name pbsx-ci --package 'system-images;android-33;google_apis;x86_64'
          sudo chown "$USER" /dev/kvm
          adb="$ANDROID_HOME/platform-tools/adb"
          export ANDROID_SERIAL=emulator-5554
          "$ANDROID_HOME/emulator/emulator" -avd pbsx-ci -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader -accel on -memory 2048 -cores 2 > "$RUNNER_TEMP/pbsx-emulator.log" 2>&1 &
          trap '"$adb" -s emulator-5554 emu kill >/dev/null 2>&1 || true' EXIT
          timeout 240 "$adb" -s emulator-5554 wait-for-device
          booted=
          for attempt in $(seq 1 120); do
            booted=$("$adb" -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')
            if [ "$booted" = 1 ]; then break; fi
            sleep 2
          done
          test "$booted" = 1
          "$adb" -s emulator-5554 shell input keyevent 82
          bash ./gradlew --no-daemon --max-workers=2 --console=plain :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.pbsx.android.DocumentsTest
      # CI uses its own disposable debug certificate. Only test reports leave
      # this runner; installable previews retain the maintainer's pinned signer.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: android-check-reports
          path: |
            pbsx-android/app/build/reports
            pbsx-android/app/build/test-results
            ${{ runner.temp }}/pbsx-emulator.log
          retention-days: 14
