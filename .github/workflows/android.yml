name: Android build and checks
on:
  push:
    paths: ['pbsx-android/**', 'pbsx-host-agent/third_party/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['pbsx-android/**', 'pbsx-host-agent/third_party/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GOWORK: 'off'
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
    defaults:
      run:
        working-directory: pbsx-android
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: pbsx-android/core/go.mod
          cache-dependency-path: pbsx-android/core/go.sum
      - name: Select Java and install pinned Android tools
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - name: Build real universal Go bindings
        working-directory: pbsx-android/core
        run: |
          go install golang.org/x/mobile/cmd/gomobile golang.org/x/mobile/cmd/gobind
          mkdir -p ../app/libs
          "$(go env GOPATH)/bin/gomobile" bind -target=android/arm64,android/amd64 -androidapi 26 -javapkg com.pbsx.core -o ../app/libs/mobilecore.aar ./mobilecore
      - name: Compile both app variants, run Java tests and lint
        run: bash ./gradlew --no-daemon --max-workers=2 --console=plain :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:testReleaseUnitTest :app:lintDebug :app:lintRelease
      # These two debug-signed APKs are short-lived instrumentation fixtures,
      # never preview downloads. The pinned maintainer signer stays out of CI.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-provider-test-apks
          path: |
            pbsx-android/app/build/outputs/apk/debug/app-debug.apk
            pbsx-android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: android-check-reports
          path: |
            pbsx-android/app/build/reports
            pbsx-android/app/build/test-results
          retention-days: 14
  provider:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: android-provider-test-apks
          path: fixtures
      # The emulator uses a clean runner, without native compilation caches or
      # an NDK download competing with its system image for disk space.
      - name: Exercise SAF restores, shared-folder jobs and settings on Android 13
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'emulator' 'system-images;android-33;aosp_atd;x86_64'
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name pbsx-ci --path "$ANDROID_AVD_HOME/pbsx-ci.avd" --package 'system-images;android-33;aosp_atd;x86_64'
          test -s "$ANDROID_AVD_HOME/pbsx-ci.ini"
          python3 - "$ANDROID_AVD_HOME/pbsx-ci.avd/config.ini" <<'PY'
          import pathlib, sys
          config = pathlib.Path(sys.argv[1])
          sizes = {'disk.dataPartition.size': '1536M', 'disk.cachePartition.size': '64M', 'hw.sdCard': 'no'}
          lines = [line for line in config.read_text().splitlines() if line.split('=', 1)[0].strip() not in sizes]
          config.write_text('\n'.join(lines + [key+'='+value for key,value in sizes.items()])+'\n')
          PY
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx pbsx-ci
          sudo chown "$USER" /dev/kvm
          adb="$ANDROID_HOME/platform-tools/adb"
          export ANDROID_SERIAL=emulator-5554
          "$ANDROID_HOME/emulator/emulator" -avd pbsx-ci -port 5554 -no-metrics -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader -accel on -memory 2048 -cores 2 > "$RUNNER_TEMP/pbsx-emulator.log" 2>&1 &
          emulator_pid=$!
          trap '"$adb" -s emulator-5554 emu kill >/dev/null 2>&1 || true' EXIT
          device=
          for attempt in $(seq 1 120); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then cat "$RUNNER_TEMP/pbsx-emulator.log"; exit 1; fi
            device=$("$adb" -s emulator-5554 get-state 2>/dev/null || true)
            if [ "$device" = device ]; then break; fi
            sleep 2
          done
          test "$device" = device
          booted=
          for attempt in $(seq 1 120); do
            booted=$("$adb" -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')
            if [ "$booted" = 1 ]; then break; fi
            sleep 2
          done
          test "$booted" = 1
          "$adb" -s emulator-5554 shell input keyevent 82
          "$adb" -s emulator-5554 install -r -t fixtures/debug/app-debug.apk
          "$adb" -s emulator-5554 install -r -t fixtures/androidTest/debug/app-debug-androidTest.apk
          "$adb" -s emulator-5554 shell am instrument -w -r -e class 'com.pbsx.android.DocumentsTest,com.pbsx.android.LocalRestoreTest,com.pbsx.android.DeviceExportTest#inlineMmsTextDoesNotOpenStaleProviderFiles,com.pbsx.android.SharedFolderJobTest,com.pbsx.android.JobStoreTest#schedulesUpdateAndCancelIndependently,com.pbsx.android.JobStoreTest#pendingScheduleSurvivesReconfigurationAndCoalescesOnlyAfterCompletion,com.pbsx.android.KeyVaultTest#completeSettingsRoundTripIncludesJobsKeysPreferencesAndHistory,com.pbsx.android.NavigationTest#newJobsStartWithNoShizukuSelectionsAndDisableDependentControls' com.pbsx.android.test/androidx.test.runner.AndroidJUnitRunner | tee "$RUNNER_TEMP/pbsx-instrumentation.log"
          python3 - "$RUNNER_TEMP/pbsx-instrumentation.log" <<'PY'
          import pathlib, re, sys
          output = pathlib.Path(sys.argv[1]).read_text()
          match = re.search(r'OK \((\d+) tests?\)', output)
          if not match or int(match[1]) < 12 or 'FAILURES!!!' in output or 'INSTRUMENTATION_FAILED' in output:
              sys.exit('Android instrumentation did not report successful completion of all twelve tests')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: android-provider-reports
          path: |
            ${{ runner.temp }}/pbsx-emulator.log
            ${{ runner.temp }}/pbsx-instrumentation.log
          retention-days: 14
